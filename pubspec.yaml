name: noisevpn
description: "Noise VPN client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_vless: 1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/icon_desktop.png"
  # Android
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_android_fg.png"
  adaptive_icon_monochrome: "assets/icon/icon_android_fg.png"
  # iOS (full-bleed, no transparency; iOS rounds the corners itself)
  ios: true
  image_path_ios: "assets/icon/icon_ios.png"
  remove_alpha_ios: true
  background_color_ios: "#000000"
  # Desktop
  windows:
    generate: true
    image_path: "assets/icon/icon_desktop.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon_macos.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon_linux.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
