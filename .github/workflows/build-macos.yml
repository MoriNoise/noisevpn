name: Build Multi-Platform

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.35.7
  MACOS_DEPLOYMENT_TARGET: "13.0"

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Noise VPN Release Build ${{ github.run_number }}"
          body: "Build in progress…"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_macos:
    runs-on: macos-15
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            /opt/hostedtoolcache/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Read app version
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/[+-].*//' | tr -d '\r ')
          [ -z "$NAME" ] && NAME="1.0.0"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "App version: $NAME (build ${{ github.run_number }})"

      - name: Clean stale build output
        run: |
          rm -rf build
          flutter clean

      - name: Disable macOS signing
        run: |
          PBXPROJ="macos/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Distribution";/CODE_SIGN_IDENTITY = "-";/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/g' "$PBXPROJ"
          sed -i '' '/buildSettings = {/a\
          CODE_SIGNING_REQUIRED = NO;\
          CODE_SIGNING_ALLOWED = NO;\
          CODE_SIGN_ENTITLEMENTS = "";\
          ' "$PBXPROJ"

      - name: Force macOS deployment target
        run: |
          PODFILE="macos/Podfile"
          PBXPROJ="macos/Runner.xcodeproj/project.pbxproj"
          TARGET="$MACOS_DEPLOYMENT_TARGET"

          if [ ! -f "$PODFILE" ]; then
            echo "::error::macos/Podfile is missing from the repo. Commit it, otherwise Flutter creates a default one with macOS 10.15."
            exit 1
          fi

          # Podfile platform line
          sed -i '' "s/^[# ]*platform :osx, '.*'/platform :osx, '$TARGET'/" "$PODFILE"
          # Pods post_install override (if present)
          sed -i '' "s/config.build_settings\['MACOSX_DEPLOYMENT_TARGET'\] = '.*'/config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = '$TARGET'/" "$PODFILE"
          # Xcode project
          sed -i '' "s/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = $TARGET;/g" "$PBXPROJ"

          # Start pods from scratch
          rm -f macos/Podfile.lock
          rm -rf macos/Pods

          echo "===== Podfile ====="
          grep -n "platform :osx\|MACOSX_DEPLOYMENT_TARGET" "$PODFILE"
          echo "===== Xcode project ====="
          grep -n "MACOSX_DEPLOYMENT_TARGET" "$PBXPROJ"

          if ! grep -q "^platform :osx, '$TARGET'" "$PODFILE"; then
            echo "::error::Podfile platform is not $TARGET"
            exit 1
          fi
          if grep "MACOSX_DEPLOYMENT_TARGET = " "$PBXPROJ" | grep -vq "= $TARGET;"; then
            echo "::error::Some MACOSX_DEPLOYMENT_TARGET values in project.pbxproj are not $TARGET"
            exit 1
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS
        run: |
          flutter build macos --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Build macOS installer (.pkg)
        env:
          VERSION: ${{ steps.ver.outputs.name }}.${{ github.run_number }}
          OUT: noise_vpn_mac_installer_${{ github.run_number }}.pkg
        run: |
          set -euo pipefail
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::No .app found"; exit 1; }
          APP_NAME=$(basename "$APP_PATH")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Contents/Info.plist")
          echo "App: $APP_NAME  ($BUNDLE_ID)  version $VERSION"

          # Ad-hoc sign the whole bundle. Without this, an unsigned app reads as
          # "damaged" on Apple Silicon. Entitlements are unchanged (none, as before).
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          rm -rf pkg && mkdir -p pkg/root pkg/scripts
          ditto "$APP_PATH" "pkg/root/$APP_NAME"

          # preinstall: quit the running app + its VPN core, remove the old copy
          # so the update is a clean replace (no leftover files from old versions).
          cat > pkg/scripts/preinstall <<EOF
          #!/bin/bash
          pkill -f "/Applications/$APP_NAME/Contents/" 2>/dev/null || true
          sleep 1
          pkill -9 -f "/Applications/$APP_NAME/Contents/" 2>/dev/null || true
          rm -rf "/Applications/$APP_NAME"
          exit 0
          EOF

          cat > pkg/scripts/postinstall <<EOF
          #!/bin/bash
          xattr -dr com.apple.quarantine "/Applications/$APP_NAME" 2>/dev/null || true
          exit 0
          EOF
          chmod +x pkg/scripts/preinstall pkg/scripts/postinstall

          # Always install into /Applications. Without this, macOS "relocates" the
          # update to wherever it finds another copy of the app with the same ID.
          pkgbuild --analyze --root pkg/root pkg/component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO pkg/component.plist
          plutil -replace 0.BundleOverwriteAction -string upgrade pkg/component.plist

          pkgbuild \
            --root pkg/root \
            --component-plist pkg/component.plist \
            --scripts pkg/scripts \
            --identifier "$BUNDLE_ID.pkg" \
            --version "$VERSION" \
            --install-location /Applications \
            pkg/app.pkg

          # Wrap it in a product archive with a title, min macOS and native arm64
          # support (otherwise Apple Silicon Macs get asked to install Rosetta).
          productbuild --synthesize --package pkg/app.pkg pkg/distribution.xml
          perl -0pi -e 's|(<installer-gui-script[^>]*>)|$1\n    <title>Noise VPN</title>\n    <allowed-os-versions><os-version min="'"$MACOS_DEPLOYMENT_TARGET"'"/></allowed-os-versions>|' pkg/distribution.xml
          grep -q hostArchitectures pkg/distribution.xml || \
            perl -pi -e 's|<options |<options hostArchitectures="x86_64,arm64" |' pkg/distribution.xml
          cat pkg/distribution.xml

          productbuild \
            --distribution pkg/distribution.xml \
            --package-path pkg \
            "$GITHUB_WORKSPACE/$OUT"

          pkgutil --check-signature "$GITHUB_WORKSPACE/$OUT" || true
          ls -lh "$GITHUB_WORKSPACE/$OUT"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: noise_vpn_mac_installer_${{ github.run_number }}.pkg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    runs-on: windows-2022
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
            C:\hostedtoolcache\windows\flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Read app version
        id: ver
        shell: bash
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/[+-].*//' | tr -d '\r ')
          [ -z "$NAME" ] && NAME="1.0.0"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "App version: $NAME (build ${{ github.run_number }})"

      - name: Clean stale build output
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path windows\flutter\ephemeral) { Remove-Item -Recurse -Force windows\flutter\ephemeral }
          flutter clean

      - name: Verify toolchain
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }}

      - name: Bundle VC++ runtime next to the exe
        shell: pwsh
        run: |
          # Flutter apps need these; a fresh Windows PC may not have them.
          $dst = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $dst -Force
          }
          Get-ChildItem $dst

      - name: Build Windows installer (setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc `
            "/DAppVersion=${{ steps.ver.outputs.name }}" `
            "/DAppBuild=${{ github.run_number }}" `
            "/DBuildDir=${{ github.workspace }}\build\windows\x64\runner\Release" `
            "/DOutputDir=${{ github.workspace }}" `
            "/DOutputName=noise_vpn_windows_setup_${{ github.run_number }}" `
            "windows\installer\noisevpn.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "${{ github.workspace }}\noise_vpn_windows_setup_${{ github.run_number }}.exe"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: noise_vpn_windows_setup_${{ github.run_number }}.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_android:
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Clean stale build output
        run: |
          rm -rf build
          flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/noise_vpn_android_build_${{ github.run_number }}.apk"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: noise_vpn_android_build_${{ github.run_number }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    runs-on: ubuntu-latest
    needs: [create_release, build_macos, build_windows, build_android]
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: build-${{ github.run_number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Drop release if nothing was built
        id: assets
        run: |
          COUNT=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No artifacts attached — removing release and tag."
            gh release delete "$TAG" -R "$REPO" --yes --cleanup-tag
          fi

      - name: Write release notes
        if: steps.assets.outputs.count != '0'
        run: |
          NAMES=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name')

          row() {
            if echo "$NAMES" | grep -qx "$1"; then
              echo "| $2 | \`$1\` | ✅ |"
            else
              echo "| $2 | — | ❌ failed |"
            fi
          }

          {
            echo "## 🛡️ Noise VPN Release — Build #${{ github.run_number }}"
            echo
            echo "| Platform | File | Status |"
            echo "|----------|------|--------|"
            row "noise_vpn_mac_installer_${{ github.run_number }}.pkg" "🍎 macOS"
            row "noise_vpn_windows_setup_${{ github.run_number }}.exe" "🪟 Windows"
            row "noise_vpn_android_build_${{ github.run_number }}.apk" "🤖 Android"
            echo
            echo "### Install or update"
            echo "The same file installs the app the first time and updates it after that. Your settings are kept."
            echo
            echo "**Windows:** run the \`.exe\`. If SmartScreen shows a warning, click **More info → Run anyway**."
            echo
            echo "**macOS:** open the \`.pkg\`. If macOS blocks it, go to **System Settings → Privacy & Security** and click **Open Anyway** (on macOS 13–14 you can also right-click the file → **Open**)."
          } > notes.md

          gh release edit "$TAG" -R "$REPO" --notes-file notes.md