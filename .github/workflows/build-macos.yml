name: Build Multi-Platform

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Noise VPN Release Build ${{ github.run_number }}"
          body: "Build in progress…"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_macos:
    runs-on: macos-15
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            /opt/hostedtoolcache/flutter
          key: flutter-3.35.1-${{ runner.os }}
          restore-keys: |
            flutter-3.35.1-${{ runner.os }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Clean stale build output
        run: |
          rm -rf build
          flutter clean

      - name: Disable macOS signing
        run: |
          PBXPROJ="macos/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Distribution";/CODE_SIGN_IDENTITY = "-";/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/g' "$PBXPROJ"
          sed -i '' '/buildSettings = {/a\
          CODE_SIGNING_REQUIRED = NO;\
          CODE_SIGNING_ALLOWED = NO;\
          CODE_SIGN_ENTITLEMENTS = "";\
          ' "$PBXPROJ"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/noise_vpn_mac_build_${{ github.run_number }}.zip" *.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: noise_vpn_mac_build_${{ github.run_number }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    runs-on: windows-2022
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
            C:\hostedtoolcache\windows\flutter
          key: flutter-3.35.1-${{ runner.os }}
          restore-keys: |
            flutter-3.35.1-${{ runner.os }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Clean stale build output
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path windows\flutter\ephemeral) { Remove-Item -Recurse -Force windows\flutter\ephemeral }
          flutter clean

      - name: Verify toolchain
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "${{ github.workspace }}\noise_vpn_windows_build_${{ github.run_number }}.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: noise_vpn_windows_build_${{ github.run_number }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_android:
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Clean stale build output
        run: |
          rm -rf build
          flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/noise_vpn_android_build_${{ github.run_number }}.apk"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: noise_vpn_android_build_${{ github.run_number }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    runs-on: ubuntu-latest
    needs: [create_release, build_macos, build_windows, build_android]
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: build-${{ github.run_number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Drop release if nothing was built
        id: assets
        run: |
          COUNT=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No artifacts attached — removing release and tag."
            gh release delete "$TAG" -R "$REPO" --yes --cleanup-tag
          fi

      - name: Write release notes
        if: steps.assets.outputs.count != '0'
        run: |
          NAMES=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name')

          row() {
            if echo "$NAMES" | grep -qx "$1"; then
              echo "| $2 | \`$1\` | ✅ |"
            else
              echo "| $2 | — | ❌ failed |"
            fi
          }

          {
            echo "## 🛡️ Noise VPN Release — Build #${{ github.run_number }}"
            echo
            echo "| Platform | File | Status |"
            echo "|----------|------|--------|"
            row "noise_vpn_mac_build_${{ github.run_number }}.zip" "🍎 macOS"
            row "noise_vpn_windows_build_${{ github.run_number }}.zip" "🪟 Windows"
            row "noise_vpn_android_build_${{ github.run_number }}.apk" "🤖 Android"
          } > notes.md

          gh release edit "$TAG" -R "$REPO" --notes-file notes.md